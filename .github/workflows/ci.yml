name: CI

# SCOPE: this pipeline asserts only what exists in the repository today.
#
# An earlier revision was written for a finished Phase 0 and referenced scripts
# and packages that had not been built yet, so every PR went red. A pipeline
# that always fails teaches people to ignore it, which is worse than having
# none. Jobs are added in the same commit as the code they verify:
#
#   • test + tenant-isolation  → LANDED with packages/database
#   • i18n key parity          → LANDED with apps/web
#   • e2e (Playwright, ar+en)  → Phase 1
#
# See docs/16 §4 for the Phase 0 exit criteria these build towards.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Individual jobs widen this only where they must,
# so a compromised action in one job cannot write to the repository.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Format · Lint · Types · Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # MUST run before lint and typecheck.
      #
      # Un-generated, @prisma/client exports an untyped placeholder, so every
      # db.unit.* call resolves to `any` and typed-lint reports ~200 no-unsafe-*
      # errors that do not exist locally where the client has been generated.
      # The errors look like a typing problem in the test file; they are
      # actually a missing build step. Any job that lints, typechecks, or runs
      # code touching @buildflow/database needs this.
      - name: Generate Prisma client
        run: pnpm --filter @buildflow/database prisma:generate

      - name: Format check
        run: pnpm format:check

      # Includes the no-hardcoded-strings rule (docs/12 §3.4) and the
      # domain-layer restrictions on ambient time and I/O (docs/06 §1).
      - name: Lint — zero warnings tolerated
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The guard that keeps docs/06 true. A PR importing Prisma into a domain
      # folder, reaching into another module's internals, or introducing a
      # cycle fails here rather than in review.
      - name: Architecture boundaries
        run: pnpm arch

  icons:
    name: Icon library integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The generator asserts: no duplicate icon names, every icon resolves to a
      # trade tone, and every icon has an Arabic label. It reads colours from
      # tokens.css rather than restating them — the two had already drifted once.
      - name: Validate icons and regenerate gallery
        run: node packages/ui/scripts/build-icon-gallery.mjs

      # The committed gallery is a reviewable artefact. If it no longer matches
      # the source, it is showing reviewers colours the product does not use.
      - name: Committed gallery is up to date
        run: |
          if ! git diff --quiet -- packages/ui/icon-gallery.html; then
            echo "::error::icon-gallery.html is stale. Run: pnpm icons:build"
            git diff --stat -- packages/ui/icon-gallery.html
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildflow/database prisma:generate
      - name: Unit tests (no database required)
        run: pnpm --filter @buildflow/core --filter @buildflow/identity test

      - name: Web component and RTL tests
        run: pnpm --filter @buildflow/web test

      # No feature ships English-only. A missing Arabic key fails the build at
      # the commit that introduced it — which is the only point at which fixing
      # it is cheap. docs/12 §7
      - name: Arabic and English key parity
        run: pnpm --filter @buildflow/web i18n:check

      - name: Web production build
        run: pnpm --filter @buildflow/web build

  tenant-isolation:
    name: Tenant isolation (gated)
    runs-on: ubuntu-latest
    # This job is separate and non-negotiable. It seeds two companies and then
    # actively TRIES to read, update, and delete across the boundary using every
    # Prisma operation, including the unfiltered `deleteMany({})` case.
    #
    # Cross-tenant access is the one bug class that ends a B2B SaaS company, so
    # it gets a dedicated gate rather than being folded into general coverage.
    # Every new repository must be represented in this suite. docs/11 §4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: buildflow
          MYSQL_DATABASE: buildflow_isolation
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pbuildflow"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:buildflow@localhost:3306/buildflow_isolation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildflow/database prisma:generate
      - run: pnpm --filter @buildflow/database prisma:deploy
      - name: Cross-tenant access must be impossible
        run: pnpm --filter @buildflow/database test:isolation

      # The audit trail is only trustworthy if it commits and rolls back with
      # the change it records. Verified against a real database, not mocked.
      - name: Audit trail integrity
        run: pnpm --filter @buildflow/database test

      # End-to-end authentication over real HTTP against a real database:
      # cookie handling, tenant context propagation, and the stolen-token
      # scenario. These seams are invisible to the unit suites.
      - name: API auth flow (end to end)
        run: pnpm --filter @buildflow/api test

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    # gitleaks-action lists the commits on a pull request so it can scan only
    # the PR range. That needs pull_requests:read, which the repository's
    # default token does not grant — hence the 403 this replaces. Read only;
    # the action never needs to write.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth 0 gives the action full history. A secret that was committed
      # and then "removed" in a later commit is still in the history and still
      # compromised, so a shallow scan of the tip is close to worthless.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # NOTE: gitleaks-action v2 is free for personal accounts and public repos.
      # If this repository is ever transferred to a GitHub organisation it will
      # additionally require a GITLEAKS_LICENSE secret, or this step should be
      # swapped for the gitleaks CLI, which needs no API access at all.
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high
